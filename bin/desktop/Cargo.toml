[package]
name = "desktop"
version = "0.1.0"
description = "Polish PIT tax calculations and records"
edition.workspace = true
authors.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "pitpls"
path = "src/main.rs"

# Read by `cargo bundle`, which builds the macOS .app (`just r`).
[package.metadata.bundle]
name = "pitpls"
identifier = "com.mngapp.pitpls"
icon = ["assets/AppIcon-compact.icns"]
copyright = "© 2026 Maksim Sech · MIT License"

[dependencies]
gpui-kit = "0.7.1"
pitpls-core.workspace = true
pitpls-app.workspace = true
pitpls-db.workspace = true
pitpls-importers.workspace = true
chrono.workspace = true
rust_decimal.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "sync"] }
dirs = "6"
# GPUI's path prompt cannot filter by file type.
rfd = { version = "0.16", default-features = false, features = ["gtk3"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSResponder"] }
