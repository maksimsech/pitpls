[package]
name = "desktop-gpui"
edition.workspace = true
authors.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "pitpls"
path = "src/main.rs"

[dependencies]
gpui-kit = "0.7.0"
pitpls-core.workspace = true
pitpls-app.workspace = true
pitpls-db.workspace = true
pitpls-importers.workspace = true
chrono.workspace = true
rust_decimal.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "sync"] }
dirs = "6"
# GPUI's path prompt cannot filter by file type. Same features as Tauri's dialog plugin.
rfd = { version = "0.16", default-features = false, features = ["gtk3"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSImage"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSData"] }
